name: Bug report
description: Something isn't working as documented
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to file a bug report.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect to happen, and what happened instead?
      placeholder: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: A minimal Ruby snippet that reproduces the problem.
      render: ruby
    validations:
      required: true
  - type: input
    id: gem-version
    attributes:
      label: fal-ai version
      placeholder: "0.3.0"
    validations:
      required: true
  - type: input
    id: ruby-version
    attributes:
      label: Ruby version
      placeholder: "ruby 3.4.2"
    validations:
      required: true
