name: Release

# Publishes the gem to RubyGems when a version tag is pushed, e.g. `git tag v0.3.0 && git push --tags`.
# Uses RubyGems trusted publishing (OIDC) — no API key secret required.
# Configure the trusted publisher once at https://rubygems.org/gems/fal-ai/trusted_publishers.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the GitHub Release
  id-token: write # exchange an OIDC token with RubyGems

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    steps:
      # Actions are pinned to commit SHAs (Dependabot keeps them up to date).
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@0dafeac902942906541bc140009cdbf32665b601 # v1
        with:
          ruby-version: "3.4"
          bundler-cache: false # no cached gems on the publish path

      - name: Install dependencies
        run: bundle install --jobs 1

      - name: Run tests and RuboCop
        run: bundle exec rake

      - name: Build and push gem to RubyGems
        uses: rubygems/release-gem@f0d7faff26625599a847d40d9fa28ace24c2aacc # v1
