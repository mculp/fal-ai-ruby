name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    # Run on every pull request, including PRs that stack on feature branches.

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Ruby ${{ matrix.ruby }}
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental || false }}
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.3", "3.4", "4.0", "4.0.4"]
        include:
          # In-development next Ruby (master, currently 4.1.0dev) — allowed to fail.
          # setup-ruby uses "ruby-head"; "4.1.0.dev" is not a recognized version.
          - ruby: "ruby-head"
            experimental: true

    steps:
      # Actions are pinned to commit SHAs (Dependabot keeps them up to date).
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up Ruby ${{ matrix.ruby }}
        uses: ruby/setup-ruby@9eb537ca036ebaed86729dcb9309076e4c5c3b74 # v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true # runs 'bundle install' and caches installed gems automatically

      - name: Run tests and RuboCop
        run: bundle exec rake
